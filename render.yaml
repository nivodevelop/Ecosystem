# Render Blueprint: приложение + PostgreSQL + диск для иконок и скринов.
# Render → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: ecosystem
    runtime: docker
    plan: starter # диск для файлов доступен на платных тарифах
    healthCheckPath: /login
    disk:
      name: files
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecosystem-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LIBRETRANSLATE_URL
        sync: false

databases:
  - name: ecosystem-db
    databaseName: traffic
    plan: free # для релиза поменяйте на платный: бесплатная база Render удаляется через 30 дней
