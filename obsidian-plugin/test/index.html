<!doctype html>
<html class="theme-dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  /* Приближение к тёмной теме Obsidian по умолчанию */
  body {
    --background-primary: #1e1e1e; --background-secondary: #262626; --background-secondary-alt: #1a1a1a;
    --background-modifier-border: #363636; --background-modifier-border-hover: #4a4a4a; --background-modifier-hover: rgba(255,255,255,0.075);
    --text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666; --text-accent: #a68af9; --text-error: #fb464c; --text-on-accent: #fff;
    --interactive-accent: #7f6df2; --interactive-accent-hsl: 254, 80%, 68%; --interactive-normal: #363636;
    margin: 0; background: var(--background-primary); color: var(--text-normal);
    font-family: -apple-system, "Inter", "Segoe UI", sans-serif; font-size: 15px;
  }
  button { font: inherit; font-size: 0.88em; padding: 6px 14px; height: 32px; border-radius: 6px; border: 0; background: var(--interactive-normal); color: var(--text-normal); cursor: pointer; display: inline-flex; align-items: center; box-shadow: 0 1px 1px rgba(0,0,0,.2); }
  button:disabled { opacity: .5; cursor: default; }
  button.mod-cta { background: var(--interactive-accent); color: #fff; }
  button.mod-warning { background: #e93147; color: #fff; }
  input, textarea, select { font: inherit; background: var(--background-modifier-form-field, #2a2a2a); color: var(--text-normal); border: 1px solid var(--background-modifier-border); border-radius: 6px; padding: 5px 10px; box-sizing: border-box; }
  input[type=checkbox] { width: auto; accent-color: var(--interactive-accent); }
  .workspace-leaf-content { height: 100vh; overflow: auto; }
  .modal { max-width: 820px; margin: 40px auto; background: var(--background-primary); border: 1px solid var(--background-modifier-border); border-radius: 12px; padding: 24px; }
  .modal-title { font-size: 1.3em; font-weight: 600; margin-bottom: 16px; }
  #notices { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
  .notice { background: #333; color: #eee; padding: 10px 14px; border-radius: 8px; max-width: 420px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
</style>
</head>
<body><div id="notices"></div><div id="app"></div><script src="dist/harness.js"></script></body>
</html>
